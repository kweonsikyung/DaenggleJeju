name: Build & Push Image

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/daengglejeju

jobs:
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_KAKAOMAP_API_KEY=${{ secrets.NEXT_PUBLIC_KAKAOMAP_API_KEY }}
            NEXT_PUBLIC_SITE_URL=https://daengglejeju.cloud
            NEXT_PUBLIC_API_URL=https://daengglejeju.cloud/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: ghcr.io/kweonsikyung/daengglejeju:.*|image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}|" infra/k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update image tag to sha-${{ github.sha }} [skip ci]"
          git push
