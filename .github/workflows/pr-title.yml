name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint-pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^#[0-9]+: [A-Za-z가-힣]"
          if ! echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "PR title must match: #이슈번호: 동사 ~"
            echo "  예시: #62: Parallelize CI jobs for faster build"
            echo "  현재: $TITLE"
            exit 1
          fi
