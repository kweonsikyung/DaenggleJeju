name: Release

on:
  push:
    branches:
      - main

jobs:
  tag-web:
    name: Tag web release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create tag if not exists
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          TAG="web@$VERSION"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

  publish-ui:
    name: Publish daenggle-ui to npm & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish and tag if not exists
        run: |
          VERSION=$(node -p "require('./packages/daenggle-ui/package.json').version")
          TAG="daenggle-ui@$VERSION"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping"
          else
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('packages/daenggle-ui/package.json', 'utf8'));
              pkg.main = './dist/index.js';
              pkg.module = './dist/index.mjs';
              pkg.types = './dist/index.d.ts';
              pkg.exports = { '.': { types: './dist/index.d.ts', import: './dist/index.mjs', require: './dist/index.js' } };
              fs.writeFileSync('packages/daenggle-ui/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            pnpm build:ui
            cd packages/daenggle-ui && npm publish && cd ../..
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Published and tagged $TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
