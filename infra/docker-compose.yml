services:
  web:
    image: ghcr.io/kweonsikyung/daengglejeju:latest
    container_name: daengglejeju-web
    expose:
      - "3000"
    env_file:
      - ../.env.local
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: daengglejeju-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
